name: Release
# Builds desktop.asar for a vX.Y.Z tag. Users only get it once the signed manifest is published in
# FlocordCLI/version.json, so a push to main never reaches anyone by itself.
on:
    push:
        tags:
            - "v*"

env:
    FORCE_COLOR: true

permissions:
    contents: write

jobs:
    Build:
        name: Build Flocord
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            TAG: ${{ github.ref_name }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

            - name: Use Node.js 24
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Check the tag matches the Flocord version
              run: |
                  version="$(node -p 'require("./package.json").version')"
                  [ "v$version" = "$TAG" ] || { echo "Tag $TAG, package.json $version"; exit 1; }
                  grep -q "\"$version\"" src/flocordplugins/FlocordAutoUpdater/version.ts || { echo "version.ts is not $version"; exit 1; }

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm buildStandalone

            - name: Publish desktop.asar
              run: gh release create "$TAG" dist/desktop.asar --title "Flocord $TAG" --notes "Flocord $TAG build. Users only receive it once the signed manifest is published in FlocordCLI/version.json."
